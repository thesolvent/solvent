name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # Uniswap deps (UniswapX/permit2) are git submodules

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: contracts/yarn.lock

      # 1inch Aqua/SwapVM deps resolve via npm into node_modules/
      - run: yarn install --frozen-lockfile

      # Pinned: forge fmt rules change across releases, so a floating latest breaks fmt --check.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.5.0"

      - run: forge fmt --check
      - run: forge build
      - run: forge test
        # Fork tests are opt-in: they run only when a MAINNET_RPC_URL secret is configured.
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --all-features
