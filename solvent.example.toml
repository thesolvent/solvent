# Solvent server config. Copy to `solvent.toml` (or point SOLVENT_CONFIG at another path — the
# `.toml` extension is implicit). `bind_addr`, `rpc_url`, `chain_id`, `aqua_address`, and
# `app_address`, and `reactor` are required.

bind_addr = "0.0.0.0:8080"
rpc_url = "http://localhost:8545"
chain_id = 31337

# The Aqua contract (allowance spender) and the SwapVM router (`app`, which keys strategies). The
# depth reader reads each maker's pullable wallet against these. Set to the devnet deploy addresses.
aqua_address = "0x0000000000000000000000000000000000000000"
app_address = "0x0000000000000000000000000000000000000000"

# Omit to boot with an empty registry snapshot (the M2 worker will hydrate it); set to hydrate now.
# database_url = "sqlite:solvent.db?mode=rwc"

default_fee_bps = 5
block_explorer_url = "http://localhost:5100"
networks = ["Ethereum"]
faucet = true

# Token metadata (Uniswap Token List JSON). Addresses must match the devnet deploy.
token_list = "tokens.devnet.json"

# Per-leg gas cost inputs. The router charges each fill leg its gas, valued from the native token's
# USD price and the chain gas price — both read from a poller-fed cache, so the quote path makes no
# RPC. Leave native_token zero / price_symbols empty to route gas-free.
native_token = "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"  # WETH
gas_units_per_leg = 150000
binance_ws_url = "wss://stream.binance.com:9443"

# USD stablecoins with no Binance pair — the quote unit itself. Pegged to $1 at boot so every
# supported asset values (USDC/DAI drift and keep their live *USDT feed above; only USDT is pegged).
usd_stable_pegs = ["0xdac17f958d2ee523a2206206994597c13d831ec7"]  # USDT

# Swap (submit) path. The resolver's Aqua filler contract and the account authorized to call it;
# the filler-owner and cosigner signing keys are read from the environment, never this file:
#   SOLVENT_SIGNER_KEY    — the filler-owner key that signs and pays for fills
#   SOLVENT_COSIGNER_KEY  — the key that cosigns each order's decay before it fills
filler = "0x0000000000000000000000000000000000000000"
# Required: the deployed UniswapX V2 reactor used by taker orders.
reactor = "0x0000000000000000000000000000000000000000"
# Canonical Permit2 (same on every chain); override only for a bespoke devnet deploy.
permit2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3"
confirmations = 1          # blocks a fill waits before it settles
reservation_ttl_secs = 60  # how long a hold survives before the TTL sweep may release it
decay_window_secs = 60     # the cosigner's decay window applied to each order

# The tx engine's durable state (redb): in-flight fills are persisted here so a restart recovers
# and reconciles them rather than losing track. Point it at a persistent volume in production.
wallet_state_db = "walletkit.redb"

# Block the registry watcher starts from. Set it to the Aqua deployment block: no strategy can
# exist before it, and scanning from genesis is thousands of getLogs calls over empty history.
registry_start_block = 0
registry_scan_span   = 2000   # blocks per getLogs; lower it if the node caps the log count

# The live order feed. UniswapX orders are off-chain signed messages until someone fills them —
# there is no mempool or event to watch — so polling the Orders API is the only way to see one.
# Omit `orders_api_url` to leave the feed off; the resolver then takes orders only from its own
# submit endpoint. Point it at a local mirror to replay recorded pages without touching the network.
# orders_api_url = "https://api.uniswap.org/v2"
order_type = "Dutch_V2"    # mainnet serves V2 Dutch; other chains run V3 or Priority reactors
order_poll_ms = 250        # the endpoint allows 4 requests/sec; one leaves per interval
feed_silence_secs = 300    # unreachable for longer than this and readiness turns false

# Cosigner keys whose signature a fed order must carry. The reactor only checks that a cosignature
# matches the order's own `cosigner` field — it has no notion of a legitimate cosigner — so pinning
# the identity is ours to do. This is Uniswap's operational key, identical on mainnet and Sepolia.
expected_cosigners = ["0x4449Cd34d1eb1FEDCF02A1Be3834FfDe8E6A6180"]

# Observation-only: 1inch Limit Order Protocol orders, seen and quote-priced alongside UniswapX's
# but never filled (no FillBuilder exists for this protocol yet). Requires ONEINCH_API_KEY in the
# environment; omit `oneinch_orderbook_url` to leave this feed off.
# oneinch_orderbook_url = "https://api.1inch.dev/orderbook/v4.1"

# Tokens the resolver will touch on either side. Empty falls back to the token list. Restricting to
# tokens a maker has actually shipped costs no reach — nothing else is fillable — and it excludes
# fee-on-transfer, rebasing, and blocklisting tokens, each of which delivers less than the reactor
# demands and reverts inside the filler's own balance guard.
admitted_tokens = []
max_outputs = 4            # each output is a token to source; an order with hundreds is a gas bomb
dedup_ttl_secs = 900       # longer than any order lives, so one order is admitted once
dedup_capacity = 16384     # bounded as well as expiring: the order stream is not ours to control
max_tracked_intents = 64   # orders held for re-pricing at once; the feed's volume is not ours to control

# Binance symbol -> the tokens it prices. Devnet tokens sit at mainnet addresses, so mainnet
# symbols apply. Stables quoted against USDT read ~1; USDT itself has no pair and stays gas-free.
[[price_symbols]]
symbol = "ETHUSDT"
tokens = ["0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"]  # WETH

[[price_symbols]]
symbol = "BTCUSDT"
tokens = ["0x2260fac5e5542a773aa44fbcfedf7c193bc2c599"]  # WBTC

[[price_symbols]]
symbol = "USDCUSDT"
tokens = ["0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"]  # USDC

[[price_symbols]]
symbol = "DAIUSDT"
tokens = ["0x6b175474e89094c44da98b954eedeac495271d0f"]  # DAI

[[price_symbols]]
symbol = "LINKUSDT"
tokens = ["0x514910771af9ca656af840dff83e8264ecf986ca"]  # LINK
