[package]
name = "solvent-adapters"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
solvent-core = { path = "../core" }
alloy = { version = "1", features = ["providers", "rpc-types-eth", "sol-types"] }
async-trait = "0.1"
futures = "0.3"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "migrate",
] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
# E2E only: node-bindings (anvil), contract deploy + local signer come via `full`.
alloy = { version = "1", features = ["full", "node-bindings"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
