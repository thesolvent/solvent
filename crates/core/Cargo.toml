[package]
name = "solvent-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
alloy-primitives = "1"
alloy-sol-types = "1"
arc-swap = "1"
async-trait = "0.1"
rust_decimal = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
