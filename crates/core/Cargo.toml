[package]
name = "solvent-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
tracing = ["dep:tracing"]
# Count curve-quote requests per solve, for the latency benchmark's cost model. Off in production.
quote-metrics = []

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"
arc-swap = "1"
async-trait = "0.1"
futures = "0.3"
itertools = "0.13"
moka = { version = "0.12", features = ["sync"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = { version = "0.1", optional = true }
utoipa = "5"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Latency benchmark: `cargo bench -p solvent-core`. Plain Instant timing, no criterion.
[[bench]]
name = "routing"
harness = false
