server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: a hard refresh or direct link to a client-side route (e.g. /swap) requests
    # that exact path from nginx, which has no matching file — without this, nginx 404s instead
    # of serving index.html and letting the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
