[profile.default]
solc = "0.8.30"
optimizer = true
optimizer_runs = 10_000_000
via_ir = true
src = "src"
test = "test"
script = "script"
libs = ["lib"]
remappings = [
    "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm/",
    "@openzeppelin/contracts@5.0.2/=node_modules/@openzeppelin/contracts/",
]
# The full AquaSwapVMRouter exceeds the EIP-170 runtime-code limit by design; the devnet deploy runs
# in forge's own EVM, so raise its limit to match the live chain (anvil --disable-code-size-limit).
code_size_limit = 100_000
# DeployDevnet writes the address manifest under ./deployments.
fs_permissions = [{ access = "write", path = "./deployments" }]

# Fork tests hit the REAL deployed UniswapX / SwapVM / Aqua. Set MAINNET_RPC_URL in the env
# (or a .env), then `forge test --fork-url mainnet`.
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header = "all"
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"
